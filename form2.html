<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form đăng ký học viên</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            background-color: #f3f6fb;
            color: #222;
            margin: 0;
            padding: 24px;
        }
        .form-box {
            max-width: 560px;
            margin: 0 auto;
            background-color: #fff;
            padding: 24px 28px;
            border: 1px solid #d8e0ec;
            border-radius: 8px;
        }
        h1 {
            color: #1d4e89;
            font-size: 22px;
            text-align: center;
            margin: 0 0 20px;
        }
        .field {
            margin-bottom: 16px;
        }
        .field > label,
        .group-title {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 10px;
            border: 1px solid #b8c4d6;
            border-radius: 4px;
            font-family: inherit;
            font-size: 15px;
        }
        textarea {
            resize: vertical;
        }
        .options label {
            display: inline-block;
            margin-right: 16px;
            font-weight: normal;
        }
        .buttons {
            text-align: center;
            margin-top: 24px;
        }
        button {
            font-family: inherit;
            font-size: 15px;
            padding: 8px 20px;
            margin: 0 6px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button[type="submit"] {
            background-color: #1d4e89;
            color: #fff;
        }
        button[type="reset"] {
            background-color: #e3e8f0;
            color: #222;
        }
    </style>
</head>
<body>
    <div class="form-box">
        <h1>Đăng ký học viên</h1>

        <form action="#" method="get">
            <div class="field">
                <label for="fullname">Họ và tên</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="field">
                <label for="phone">Số điện thoại</label>
                <input type="tel" id="phone" name="phone">
            </div>

            <div class="field">
                <label for="birthday">Ngày sinh</label>
                <input type="date" id="birthday" name="birthday">
            </div>

            <div class="field options">
                <span class="group-title">Giới tính</span>
                <label><input type="radio" name="gender" value="Nam"> Nam</label>
                <label><input type="radio" name="gender" value="Nữ"> Nữ</label>
                <label><input type="radio" name="gender" value="Khác"> Khác</label>
            </div>

            <div class="field">
                <label for="address">Địa chỉ</label>
                <textarea id="address" name="address" rows="2"></textarea>
            </div>

            <div class="field">
                <label for="course">Khóa học</label>
                <select id="course" name="course">
                    <option value="html-css">HTML &amp; CSS</option>
                    <option value="javascript">JavaScript</option>
                    <option value="java">Java</option>
                    <option value="python">Python</option>
                </select>
            </div>

            <div class="field options">
                <span class="group-title">Hình thức học</span>
                <label><input type="radio" name="study_type" value="online"> Online</label>
                <label><input type="radio" name="study_type" value="offline"> Offline</label>
            </div>

            <div class="field options">
                <span class="group-title">Sở thích</span>
                <label><input type="checkbox" name="hobby" value="reading"> Đọc sách</label>
                <label><input type="checkbox" name="hobby" value="music"> Nghe nhạc</label>
                <label><input type="checkbox" name="hobby" value="travel"> Du lịch</label>
                <label><input type="checkbox" name="hobby" value="sports"> Thể thao</label>
            </div>

            <div class="field">
                <label for="note">Ghi chú</label>
                <textarea id="note" name="note" rows="3"></textarea>
            </div>

            <div class="buttons">
                <button type="submit">Đăng ký</button>
                <button type="reset">Nhập lại</button>
            </div>
        </form>
    </div>
</body>
</html>
